# L'utilisateur passe de l'onglet Villes à l'onglet Météo et revient :
# l'onglet actif est sélectionné. Localisation refusée pour ne pas dépendre du réseau.
appId: com.wernom.weteo
name: Navigation par onglets
---
- runFlow: localisation-refusee.yaml
- tapOn:
    id: onglet-meteo
- assertVisible: 'Autorise la localisation pour voir la météo autour de toi.'
- assertVisible:
    id: onglet-meteo
    selected: true
- assertNotVisible: 'Bientôt : tes villes favorites.'
- tapOn:
    id: onglet-villes
- assertVisible: 'Bientôt : tes villes favorites.'
- assertVisible:
    id: onglet-villes
    selected: true
