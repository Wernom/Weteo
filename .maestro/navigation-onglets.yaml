# L'utilisateur passe de l'onglet Villes à l'onglet Météo et revient :
# l'onglet actif est sélectionné. Localisation refusée pour ne pas dépendre du réseau.
appId: com.wernom.weteo
name: Navigation par onglets
---
- runFlow: localisation-refusee.yaml
- tapOn:
    id: onglet-meteo
- assertVisible: 'Autorisez la localisation pour voir la météo autour de vous.'
- assertVisible:
    id: onglet-meteo
    selected: true
- assertNotVisible:
    id: recherche-ville
- tapOn:
    id: onglet-villes
- assertVisible:
    id: recherche-ville
- assertVisible:
    id: onglet-villes
    selected: true
