# L'utilisateur cherche « Lyon », l'ajoute aux favoris avec l'étoile : sans recherche, la ville
# est listée sous « Ma position » avec sa météo. Après redémarrage, sans localisation, l'app
# s'ouvre sur sa page ; la ville est toujours listée, puis il la supprime (vraie API Open-Meteo).
appId: com.wernom.weteo
name: Villes favorites
---
- runFlow: localisation-refusee.yaml
- tapOn:
    id: recherche-ville
# Gboard peut proposer d'essayer le stylet au premier champ touché : on ferme.
- waitForAnimationToEnd
- tapOn:
    text: 'Cancel|Annuler'
    optional: true
- inputText: 'Lyon'
- extendedWaitUntil:
    visible: 'Auvergne-Rhône-Alpes, France'
    timeout: 20000
- tapOn:
    id: etoile-0
- assertVisible: 'Retirer Lyon des favoris'
- eraseText
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: ma-position
    timeout: 5000
- assertVisible:
    id: favori-0
- assertVisible: 'Lyon'
# Météo résumée de la ville : l'API peut être lente en CI (jusqu'à 3 essais de 10 s).
- extendedWaitUntil:
    visible: '-?\d+°'
    timeout: 60000

# Redémarrage : les favoris sont conservés.
- stopApp
- launchApp:
    permissions:
      location: deny
# La permission est redemandée au lancement selon la version d'Android.
# Au premier lancement après installation, elle peut mettre plusieurs secondes à venir :
# on attend l'une ou l'autre avant le tap optionnel, qui n'attend pas assez.
- extendedWaitUntil:
    visible: 'Don.t allow|Ne pas autoriser|Page 2 sur 2'
    timeout: 30000
- tapOn:
    text: 'Don.t allow|Ne pas autoriser'
    optional: true
- extendedWaitUntil:
    visible: 'Page 2 sur 2'
    timeout: 20000
- assertVisible:
    id: onglet-meteo
    selected: true
- tapOn:
    id: onglet-villes
- assertVisible:
    id: ma-position
- assertVisible: 'Auvergne-Rhône-Alpes, France'

- tapOn: 'Supprimer Lyon'
- assertNotVisible: 'Auvergne-Rhône-Alpes, France'
- assertNotVisible:
    id: favori-0
- assertVisible:
    id: ma-position
