# Au premier lancement, l'utilisateur refuse la localisation :
# la recherche de ville s'ouvre (onglet Villes).
appId: com.wernom.weteo
name: Localisation refusée
---
# Android peut tuer le processus en plein démarrage juste après clearState (retour à l'accueil) :
# on relance une fois.
# La boîte de dialogue système peut apparaître selon la version d'Android.
# Au premier lancement après installation, elle peut mettre plusieurs secondes à venir :
# on attend l'une ou l'autre avant le tap optionnel, qui n'attend pas assez.
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: deny
      - extendedWaitUntil:
          visible: 'Don.t allow|Ne pas autoriser|Rechercher une ville'
          timeout: 30000
- tapOn:
    text: 'Don.t allow|Ne pas autoriser'
    optional: true
- extendedWaitUntil:
    visible: 'Rechercher une ville'
    timeout: 20000
- assertVisible:
    id: onglet-villes
    selected: true
