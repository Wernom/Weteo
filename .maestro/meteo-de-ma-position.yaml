# L'utilisateur accepte la localisation : l'écran Météo affiche
# la température et les prévisions sur 7 jours (vraie API Open-Meteo).
appId: com.wernom.weteo
name: Météo de ma position
---
- setLocation:
    latitude: 48.8566
    longitude: 2.3522
- launchApp:
    clearState: true
    permissions:
      location: allow
- extendedWaitUntil:
    visible: 'Ressenti .*'
    timeout: 60000
- assertVisible: 'Humidité .*'
- assertVisible: 'Vent .*'
# Sur un petit écran, les prévisions sont sous le bandeau horaire.
- scrollUntilVisible:
    element:
      text: 'Prévisions sur 7 jours'
- scrollUntilVisible:
    element:
      text: "Aujourd'hui"
